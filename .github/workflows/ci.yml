# Contrôles de chaque push sur main et de chaque pull request : tests de l'API
# (PostgreSQL réel via Testcontainers), tests et build de l'interface, santé
# de la documentation, build des deux images, signature DCO de chaque commit
# (ADR-0010), recette de la pile de démonstration sur une base vierge. Sur une pull request,
# en plus : preuve que ses tests échouent sans son changement, dépendances ajoutées
# (vulnérabilités, licences), analyse des workflows. Sur main, une fois tout vert, images de
# développement « edge » publiées sur ghcr.io (aucun tag git, aucune release).
# Actions épinglées par SHA (tenues à jour par Dependabot) ; jeton en lecture seule.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Une pull request n'a que sa dernière exécution (les précédentes s'annulent) ; sur main,
# chaque commit garde la sienne jusqu'au bout (groupe par commit) : une fusion qui en suit
# une autre n'efface pas le contrôle, Recette et DCO compris, de la précédente.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # L'API et le projet de tests ciblent net10.0 (LTS).
          dotnet-version: 10.0.x
      - name: Tests
        run: dotnet test tests/SAloha.Api.Tests --collect:"XPlat Code Coverage" --results-directory couverture
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      # Q5 : la couverture se mesure et se montre, sans seuil qui bloque une PR. Les
      # migrations, générées, sont exclues : elles portaient le taux de lignes à 99 %.
      - name: Couverture (résumé et rapport)
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install --tool-path .outils dotnet-reportgenerator-globaltool --version 5.5.12
          .outils/reportgenerator "-reports:couverture/**/coverage.cobertura.xml" -targetdir:couverture/rapport \
            "-reporttypes:Html;MarkdownSummaryGithub" "-filefilters:-*/Migrations/*"
          cat couverture/rapport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: couverture-api
          path: couverture/rapport
          retention-days: 14
      - name: Dépendances vulnérables
        run: |
          dotnet list backend/SAloha.Api.csproj package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  web:
    name: Interface (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dépendances vulnérables
        run: npm audit --audit-level=high

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/changelog.py

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t s-aloha-api backend
      - run: docker build -t s-aloha-web frontend

  recette:
    # Recette sur une pile neuve, à chaque PR et sur main : pile de démonstration construite
    # depuis les sources (base vierge, annuaire Samba AD, API, interface ; sans le service
    # d'embeddings), données d'exemple chargées par l'API, puis scripts/recette.py par
    # l'interface. Remplace la recette manuelle avant fusion.
    name: Recette
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -p s-aloha-recette -f docker-compose.yml -f docker-compose.demo.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pile de démonstration
        run: $COMPOSE up -d --build --quiet-pull db annuaire api web
      - name: Données d'exemple
        run: python3 demo/donnees/charger.py http://localhost:8080
      - name: Contrôles
        run: python3 scripts/recette.py http://localhost
      - name: Journaux de la pile
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Arrêt
        if: always()
        run: $COMPOSE down -v

  preuve:
    # Les tests ajoutés ou modifiés par la PR, rejoués sur le code de la base : ils doivent
    # échouer, sinon ils ne prouvent pas le changement (scripts/preuve.py). Exception :
    # étiquette `preuve-non-requise` posée par le mainteneur, puis relancer ce job.
    name: Preuve
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tests de la PR sur la base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ETIQUETTES: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/preuve.py "$BASE" "$HEAD" --etiquettes "$ETIQUETTES"

  dependances:
    # Dépendances ajoutées ou changées par la PR : vulnérabilité haute ou critique, ou
    # licence incompatible avec l'AGPLv3, refusées.
    name: Dépendances ajoutées
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: SSPL-1.0, BUSL-1.1, Elastic-2.0, CC-BY-NC-4.0, CC-BY-NC-SA-4.0
          comment-summary-in-pr: never

  workflows:
    # Workflows de .github/ : syntaxe et expressions (actionlint), sécurité (zizmor :
    # injection, déclencheurs, permissions). Outils épinglés par version et empreinte.
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12
        run: |
          curl -sSfL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color
      - name: zizmor 1.31.1
        run: |
          pip download --quiet --no-deps --only-binary=:all: -d whl zizmor==1.31.1
          echo "58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410  whl/zizmor-1.31.1-py3-none-manylinux_2_28_x86_64.whl" | sha256sum -c -
          python3 -m zipfile -e whl/zizmor-1.31.1-py3-none-manylinux_2_28_x86_64.whl zizmor-whl
          chmod +x zizmor-whl/zizmor-1.31.1.data/scripts/zizmor
          zizmor-whl/zizmor-1.31.1.data/scripts/zizmor --offline --format github .github/workflows/

  edge:
    # Images de développement : l'état de main, à chaque fusion. « latest » et les
    # versions restent l'affaire de publication.yml (tag vX.Y.Z).
    name: Images edge (ghcr.io)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, docs, images, recette]
    runs-on: ubuntu-latest
    # Une publication à la fois ; un commit dépassé par main ne republie pas edge.
    concurrency:
      group: edge
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Toujours la tête de main ?
        id: tete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tete=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tete" = "$GITHUB_SHA" ]; then echo "publier=oui" >> "$GITHUB_OUTPUT"
          else echo "main est à ${tete:0:7} : edge sera publié par son exécution."; echo "publier=non" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tete.outputs.publier == 'oui'
        with:
          persist-credentials: false
      - name: Connexion au registre
        if: steps.tete.outputs.publier == 'oui'
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
          ACTEUR: ${{ github.actor }}
        run: echo "$JETON" | docker login ghcr.io -u "$ACTEUR" --password-stdin
      - name: Construction et envoi
        if: steps.tete.outputs.publier == 'oui'
        env:
          VERSION: 0.0.0-edge
          COMMIT: ${{ github.sha }}
        run: bash scripts/publier-images.sh edge

  dco:
    # Sur une pull request : les commits de la branche. Sur main : les commits arrivés par la
    # fusion, car un squash dont le message a été réécrit peut perdre le Signed-off-by.
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Signed-off-by de l'auteur sur chaque commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$c")
            # Les bots (Dependabot) ne signent pas : ils ne cèdent aucun code d'auteur.
            case "$email" in *"[bot]@users.noreply.github.com") continue ;; esac
            if git log -1 --format=%B "$c" | git interpret-trailers --parse \
                 | grep -i "^signed-off-by:" | grep -qF "<$email>"; then
              echo "✔ $(git log -1 --format='%h %s' "$c")"
            else
              echo "::error::Commit $(git log -1 --format='%h « %s »' "$c") sans Signed-off-by pour <$email>"
              fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "Fusion sans signature : main ne se réécrit pas, le noter au journal (ADR-0010)."
            else
              echo "Signez vos commits : git commit -s (voir CONTRIBUTING.md § Certificat d'origine)."
              echo "Rattrapage : git rebase --signoff $BASE puis git push --force-with-lease."
            fi
          fi
          exit $fail

  hygiene:
    # Avertissements seulement pour l'instant (ne bloque pas la fusion) : trailers autres
    # que Signed-off-by, termes réservés (liste dans le secret HYGIENE_TERMES, jamais
    # affichée). scripts/check-hygiene.py ; --strict le rendra bloquant.
    name: Hygiène
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Trailers et termes réservés
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HYGIENE_TERMES: ${{ secrets.HYGIENE_TERMES }}
        run: python3 scripts/check-hygiene.py "$BASE" "$HEAD"
