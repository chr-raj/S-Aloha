# Garde-fous de chaque pull request (scripts/garde-fous.py) : aucun test supprimé, réduit
# ou désactivé ; outillage de vérification modifié seulement avec l'étiquette `outillage`
# du mainteneur. Rejoué quand une étiquette change. Classe de risque posée en étiquette
# d'après les chemins touchés : `risque-doc`, `risque-code` ou `risque-sensible`.
name: Garde-fous

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Concurrence par job : une étiquette posée juste après l'ouverture ne doit annuler que
# l'ancien contrôle Garde-fous, jamais la classe de risque (#243, 2026-11-03). Depuis le
# 2026-11-11, la classe se recalcule aussi sur `labeled` et `unlabeled` : une écriture qui
# REMPLACE la liste des étiquettes (pose d'`a-verifier` par l'API « set labels ») avait
# effacé `risque-sensible` de #298 et `risque-code` de #299 à la seconde où le workflow les
# avait posées ; sans classe, ANDRANA ne fusionne pas. Le dépôt est public : ces
# exécutions ne coûtent rien. Reposer une étiquette déjà présente n'émet pas d'événement,
# le recalcul converge.
jobs:
  garde-fous:
    name: Garde-fous
    concurrency:
      group: garde-fous-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Tests, outillage
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ETIQUETTES: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTEUR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/garde-fous.py "$BASE" "$HEAD" --etiquettes "$ETIQUETTES" --auteur "$AUTEUR"

  risque:
    name: Classe de risque
    # Ni fork ni Dependabot : leur jeton est en lecture seule. Tous les événements, y compris
    # `labeled` et `unlabeled` : la classe doit survivre à une étiquette posée par-dessus.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    concurrency:
      group: risque-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Étiquette
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          classe=$(python3 scripts/garde-fous.py "$BASE" "$HEAD" --risque)
          echo "Classe : $classe"
          # API REST : `gh pr edit` échoue sur la dépréciation des Projects classiques.
          actuelles=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '[.[].name] | join(",")')
          for e in risque-doc risque-code risque-sensible; do
            if [ "$e" != "$classe" ] && printf '%s' ",$actuelles," | grep -q ",$e,"; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$e" >/dev/null
            fi
          done
          if printf '%s' ",$actuelles," | grep -q ",$classe,"; then
            echo "Déjà posée."
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=$classe" >/dev/null
          fi
